<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enter Your Code | Sign. Selfie. Send.</title><link rel="icon" href="assets/img/favicon.svg"><link rel="stylesheet" href="assets/css/style.css"></head><body class="guest-page-v3"><main class="join-shell"><img src="assets/img/favicon.svg" alt=""><div class="eyebrow">QR NOT COOPERATING?</div><h1>Enter the code on your card.</h1><p>It looks like <b>EVENT-024</b> and is printed directly under the QR.</p><form id="joinForm"><input id="joinCode" autocomplete="off" autocapitalize="characters" placeholder="EVENT-024" maxlength="20"><button class="btn" type="submit">Open my selfie spot →</button></form><a href="index.html">What is Sign. Selfie. Send.?</a></main><div class="toast" id="toast"></div><script src="assets/js/core.js"></script><script>document.getElementById('joinForm').onsubmit=e=>{e.preventDefault();const v=document.getElementById('joinCode').value.trim().toUpperCase(),m=v.match(/(\d{1,3})$/);if(!m)return SSS.toast('Check the code and try again');location.href=`guest.html?event=demo&slot=${String(Number(m[1])).padStart(3,'0')}`}</script></body></html>
